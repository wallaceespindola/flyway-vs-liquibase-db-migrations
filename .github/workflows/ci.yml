# CI for flyway-vs-liquibase-db-migrations
# Author: Wallace Espindola

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test and verify coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build, test and enforce the coverage gate
        run: mvn -B verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn

  smoke:
    name: Boot the app and verify both engines migrated
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Package
        run: mvn -B -q -DskipTests package

      - name: Start the application
        run: |
          java -jar target/flyway-vs-liquibase-db-migrations.jar > app.log 2>&1 &
          echo $! > app.pid
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/v1/health > /dev/null 2>&1; then
              echo "Application is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Application failed to become healthy" >&2
          tail -60 app.log >&2
          exit 1

      - name: Assert both engines produced an equivalent schema
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8080/api/v1/comparison -o comparison.json
          python3 - <<'PY'
          import json, sys

          with open("comparison.json") as fh:
              report = json.load(fh)["data"]

          failures = []
          if not report["schemasEquivalent"]:
              failures.append(f"schemas differ: {report['schemaDifferences']}")
          if report["flyway"]["appliedCount"] == 0:
              failures.append("Flyway applied no migrations")
          if report["liquibase"]["appliedCount"] == 0:
              failures.append("Liquibase applied no changesets")

          if failures:
              print("SMOKE TEST FAILED:", *failures, sep="\n  ")
              sys.exit(1)

          print(f"Flyway applied {report['flyway']['appliedCount']} migrations")
          print(f"Liquibase applied {report['liquibase']['appliedCount']} changesets")
          print("Both engines produced an equivalent business schema")
          PY

      - name: Check the dashboard is served
        run: curl -fsS http://localhost:8080/ | grep -q "Flyway" && echo "Dashboard OK"

      - name: Stop the application
        if: always()
        run: kill "$(cat app.pid)" 2>/dev/null || true

      - name: Upload application log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-log
          path: app.log
