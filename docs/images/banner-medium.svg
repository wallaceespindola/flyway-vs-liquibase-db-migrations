  <rect width="1400" height="700" fill="url(#bg)"/>
  <ellipse cx="170.0" cy="130.0" rx="620.0" ry="470.0" fill="url(#glowL)"/>
  <ellipse cx="1230.0" cy="580.0" rx="620.0" ry="470.0" fill="url(#glowR)"/>

  <rect x="56.0" y="56.0" width="1288.0" height="588.0" fill="none"
