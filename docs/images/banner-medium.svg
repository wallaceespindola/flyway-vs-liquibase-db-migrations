<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1a2337"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f2784b"/>
      <stop offset="100%" stop-color="#35c4d0"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f2784b" stop-opacity="0.26"/>
      <stop offset="55%" stop-color="#f2784b" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#f2784b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#35c4d0" stop-opacity="0.26"/>
      <stop offset="55%" stop-color="#35c4d0" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#35c4d0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1400" height="700" fill="url(#bg)"/>
  <ellipse cx="175.0" cy="140.0" rx="653.33" ry="501.67" fill="url(#glowL)"/>
  <ellipse cx="1225.0" cy="571.67" rx="653.33" ry="501.67" fill="url(#glowR)"/>

  <!-- accent edges: Flyway left, Liquibase right -->
  <rect x="0" y="0" width="8.17" height="700" fill="#f2784b"/>
  <rect x="1391.83" y="0" width="8.17" height="700" fill="#35c4d0"/>

  <text x="700.0" y="133.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="24.5" fill="#94a3b8" letter-spacing="5.83"
        font-weight="600">MEDIUM</text>

  <text x="700.0" y="296.33" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="121.33" font-weight="700" letter-spacing="-2.33">
    <tspan fill="#f2784b">Flyway</tspan><tspan fill="#94a3b8" dx="30.33"
      font-size="60.67" font-weight="400">vs</tspan><tspan fill="#35c4d0"
      dx="30.33">Liquibase</tspan>
  </text>

  <rect x="525.0" y="373.33" width="350.0" height="4.67" rx="2.33"
        fill="url(#rule)"/>

  <text x="700.0" y="436.33" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="31.5" fill="#e6ecf7" opacity="0.92">I built the same schema twice and diffed the result.</text>

  <!-- applied-count chips, the two real numbers from the app -->
  <g>
    <rect x="459.665" y="520.33" width="228.67" height="58.33" rx="29.17"
          fill="#f2784b" fill-opacity="0.13" stroke="#f2784b" stroke-opacity="0.55"
          stroke-width="1.75"/>
    <text x="574.0" y="558.8278" text-anchor="middle"
          font-family="Menlo, Consolas, monospace" font-size="24.5" fill="#f2784b">6 migrations</text>

    <rect x="711.665" y="520.33" width="228.67" height="58.33" rx="29.17"
          fill="#35c4d0" fill-opacity="0.13" stroke="#35c4d0" stroke-opacity="0.55"
          stroke-width="1.75"/>
    <text x="826.0" y="558.8278" text-anchor="middle"
          font-family="Menlo, Consolas, monospace" font-size="24.5" fill="#35c4d0">7 changesets</text>
  </g>

  <text x="700.0" y="655.67" text-anchor="middle" font-family="Menlo, Consolas, monospace"
        font-size="23.33" fill="#4ade80" opacity="0.9">"schemasEquivalent": true</text>
</svg>
