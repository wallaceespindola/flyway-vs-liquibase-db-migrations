  <line x1="640.0" y1="367.5" x2="760.0" y2="367.5" stroke="#94a3b8"
        stroke-width="1.5"/>

  <text x="700.0" y="437.5" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="30.0"
