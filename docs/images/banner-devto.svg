  <text x="478.0" y="85.04" text-anchor="end"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.0" fill="#94a3b8" letter-spacing="1.0">SQL</text>  <text x="34.0" y="118.0" font-family="Menlo, Consolas, monospace" font-size="11.5" xml:space="preserve"><tspan fill="#f2784b">CREATE TABLE</tspan><tspan fill="#e6ecf7"> product_audit (</tspan></text>  <text x="34.0" y="136.5" font-family="Menlo, Consolas, monospace" font-size="11.5" xml:space="preserve"><tspan fill="#e6ecf7">  id</tspan><tspan fill="#a78bfa">           BIGINT</tspan><tspan fill="#e6ecf7"> AUTO_INCREMENT PK,</tspan></text>  <text x="34.0" y="155.0" font-family="Menlo, Consolas, monospace" font-size="11.5" xml:space="preserve"><tspan fill="#e6ecf7">  product_id</tspan><tspan fill="#a78bfa">   BIGINT</tspan><tspan fill="#e6ecf7">  NOT NULL,</tspan></text>  <text x="34.0" y="173.5" font-family="Menlo, Consolas, monospace" font-size="11.5" xml:space="preserve"><tspan fill="#e6ecf7">  audit_action</tspan><tspan fill="#a78bfa"> VARCHAR(20)</tspan><tspan fill="#e6ecf7"> NOT NULL,</tspan></text>  <text x="34.0" y="192.0" font-family="Menlo, Consolas, monospace" font-size="11.5" xml:space="preserve"><tspan fill="#e6ecf7">  changed_by</tspan><tspan fill="#a78bfa">   VARCHAR(100)</tspan><tspan fill="#f2784b"> DEFAULT</tspan><tspan fill="#9ae6b4"> 'system',</tspan></text>  <text x="34.0" y="210.5" font-family="Menlo, Consolas, monospace" font-size="11.5" xml:space="preserve"><tspan fill="#e6ecf7">  changed_at</tspan><tspan fill="#a78bfa">   TIMESTAMP</tspan><tspan fill="#e6ecf7">  NOT NULL</tspan></text>  <text x="34.0" y="229.0" font-family="Menlo, Consolas, monospace" font-size="11.5" xml:space="preserve"><tspan fill="#e6ecf7">);</tspan></text>  <text x="34.0" y="247.5" font-family="Menlo, Consolas, monospace" font-size="11.5" xml:space="preserve"><tspan fill="#e6ecf7"></tspan></text>  <rect x="28.0" y="252.68" width="456.0" height="18.5" rx="3.0" fill="#94a3b8" fill-opacity="0.07"/>  <text x="34.0" y="266.0" font-family="Menlo, Consolas, monospace" font-size="11.5" xml:space="preserve"><tspan fill="#64748b">-- No precondition. No guard.</tspan></text>  <text x="34.0" y="284.5" font-family="Menlo, Consolas, monospace" font-size="11.5" xml:space="preserve"><tspan fill="#e6ecf7"></tspan></text>  <rect x="28.0" y="289.68" width="456.0" height="18.5" rx="3.0" fill="#94a3b8" fill-opacity="0.07"/>  <text x="34.0" y="303.0" font-family="Menlo, Consolas, monospace" font-size="11.5" xml:space="preserve"><tspan fill="#64748b">-- No rollback. Reverting means</tspan></text>  <rect x="28.0" y="308.18" width="456.0" height="18.5" rx="3.0" fill="#94a3b8" fill-opacity="0.07"/>  <text x="34.0" y="321.5" font-family="Menlo, Consolas, monospace" font-size="11.5" xml:space="preserve"><tspan fill="#64748b">-- a NEW forward migration.</tspan></text>  <rect x="28.0" y="326.68" width="456.0" height="18.5" rx="3.0" fill="#94a3b8" fill-opacity="0.07"/>  <text x="34.0" y="340.0" font-family="Menlo, Consolas, monospace" font-size="11.5" xml:space="preserve"><tspan fill="#64748b">-- undo is a paid Teams feature.</tspan></text>

