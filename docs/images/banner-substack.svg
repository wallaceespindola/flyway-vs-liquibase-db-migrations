<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1a2337"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f2784b"/>
      <stop offset="100%" stop-color="#35c4d0"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f2784b" stop-opacity="0.26"/>
      <stop offset="55%" stop-color="#f2784b" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#f2784b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#35c4d0" stop-opacity="0.26"/>
      <stop offset="55%" stop-color="#35c4d0" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#35c4d0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>
  <ellipse cx="150.0" cy="120.0" rx="560.0" ry="430.0" fill="url(#glowL)"/>
  <ellipse cx="1050.0" cy="490.0" rx="560.0" ry="430.0" fill="url(#glowR)"/>

  <!-- accent edges: Flyway left, Liquibase right -->
  <rect x="0" y="0" width="7.0" height="600" fill="#f2784b"/>
  <rect x="1193.0" y="0" width="7.0" height="600" fill="#35c4d0"/>

  <text x="600.0" y="114.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="21.0" fill="#94a3b8" letter-spacing="5.0"
        font-weight="600">NEWSLETTER</text>

  <text x="600.0" y="254.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="104.0" font-weight="700" letter-spacing="-2.0">
    <tspan fill="#f2784b">Flyway</tspan><tspan fill="#94a3b8" dx="26.0"
      font-size="52.0" font-weight="400">vs</tspan><tspan fill="#35c4d0"
      dx="26.0">Liquibase</tspan>
  </text>

  <rect x="450.0" y="320.0" width="300.0" height="4.0" rx="2.0"
        fill="url(#rule)"/>

  <text x="600.0" y="374.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="27.0" fill="#e6ecf7" opacity="0.92">The comparison, run as an application.</text>

  <!-- applied-count chips, the two real numbers from the app -->
  <g>
    <rect x="394.0" y="446.0" width="196.0" height="50.0" rx="25.0"
          fill="#f2784b" fill-opacity="0.13" stroke="#f2784b" stroke-opacity="0.55"
          stroke-width="1.5"/>
    <text x="492.0" y="479.0" text-anchor="middle"
          font-family="Menlo, Consolas, monospace" font-size="21.0" fill="#f2784b">6 migrations</text>

    <rect x="610.0" y="446.0" width="196.0" height="50.0" rx="25.0"
          fill="#35c4d0" fill-opacity="0.13" stroke="#35c4d0" stroke-opacity="0.55"
          stroke-width="1.5"/>
    <text x="708.0" y="479.0" text-anchor="middle"
          font-family="Menlo, Consolas, monospace" font-size="21.0" fill="#35c4d0">7 changesets</text>
  </g>

  <text x="600.0" y="562.0" text-anchor="middle" font-family="Menlo, Consolas, monospace"
        font-size="20.0" fill="#4ade80" opacity="0.9">"schemasEquivalent": true</text>
</svg>
