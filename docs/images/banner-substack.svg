<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1a2337"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f2784b"/>
      <stop offset="100%" stop-color="#35c4d0"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f2784b" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#f2784b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#35c4d0" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#35c4d0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>

  <line x1="90.0" y1="96.0" x2="1110.0" y2="96.0" stroke="#2a3650"
        stroke-width="1.5"/>
  <line x1="90.0" y1="504.0" x2="1110.0" y2="504.0" stroke="#2a3650"
        stroke-width="1.5"/>

  <text x="90.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18.0" fill="#94a3b8"
        letter-spacing="4.0" font-weight="600">THE NEWSLETTER</text>
  <text x="1110.0" y="70.0" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18.0"
        fill="#94a3b8" letter-spacing="2.0">wallaceespindola</text>

  <text x="600.0" y="240.0" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="88.0"
        font-weight="400" letter-spacing="-1.0">
    <tspan fill="#f2784b">Flyway</tspan><tspan fill="#94a3b8" dx="22.0" font-size="44.0"
      font-style="italic">vs</tspan><tspan fill="#35c4d0" dx="22.0">Liquibase</tspan>
  </text>

  <text x="600.0" y="327.0" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="28.0"
        fill="#e6ecf7" font-style="italic">I made them prove it, in the same application.</text>

  <g font-family="Menlo, Consolas, monospace" font-size="20.0">
    <text x="370.0" y="423.0" text-anchor="middle" fill="#f2784b">6 migrations</text>
    <text x="600.0" y="423.0" text-anchor="middle" fill="#94a3b8">·</text>
    <text x="830.0" y="423.0" text-anchor="middle" fill="#35c4d0">7 changesets</text>
  </g>
  <!-- Kept clear of the bottom rule at h - 96; sitting on it read as a collision. -->
  <text x="600.0" y="471.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="22.0"
        fill="#4ade80">0 schema differences</text>
</svg>
