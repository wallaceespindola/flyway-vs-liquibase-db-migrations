<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1a2337"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f2784b"/>
      <stop offset="100%" stop-color="#35c4d0"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f2784b" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#f2784b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#35c4d0" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#35c4d0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <ellipse cx="180.0" cy="960.0" rx="840.0" ry="645.0" fill="url(#glowL)"/>
  <ellipse cx="1740.0" cy="120.0" rx="840.0" ry="645.0" fill="url(#glowR)"/>

  <rect x="0" y="0" width="15.0" height="1080" fill="url(#rule)"/>

  <text x="126.0" y="237.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28.5" fill="#94a3b8"
        letter-spacing="7.5" font-weight="600">MIGRATION TOOLING</text>

  <text x="126.0" y="394.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="105.0" font-weight="700"
        letter-spacing="-2.25" fill="#f2784b">Flyway</text>
  <text x="126.0" y="513.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="105.0" font-weight="700"
        letter-spacing="-2.25">
    <tspan fill="#94a3b8" font-size="60.0" font-weight="400">vs</tspan><tspan
      fill="#35c4d0" dx="24.0">Liquibase</tspan>
  </text>

  <!-- A rect, not a line: a gradient stroke on a horizontal line has a zero-height object
       bounding box, so url(#rule) cannot resolve and the rule renders invisible. -->
  <rect x="126.0" y="585.6" width="180.0" height="7.5" rx="3.75"
        fill="url(#rule)"/>

  <text x="126.0" y="696.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="39.0" fill="#e6ecf7">Same schema. Two engines.</text>
  <text x="126.0" y="761.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="39.0" fill="#e6ecf7">What actually differs.</text>

  <rect x="1275.0" y="324.0" width="519.0" height="450.0" rx="21.0"
        fill="#1a2337" fill-opacity="0.85" stroke="#2a3650" stroke-width="2.25"/>

  <text x="1317.0" y="435.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28.5"
        fill="#94a3b8">Flyway migrations</text>
  <text x="1752.0" y="435.0" text-anchor="end" font-family="Menlo, Consolas, monospace"
        font-size="60.0" font-weight="700" fill="#f2784b">6</text>
  <line x1="1317.0" y1="474.0" x2="1752.0" y2="474.0"
        stroke="#2a3650" stroke-width="1.5"/>

  <text x="1317.0" y="579.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28.5"
        fill="#94a3b8">Liquibase changesets</text>
  <text x="1752.0" y="579.0" text-anchor="end" font-family="Menlo, Consolas, monospace"
        font-size="60.0" font-weight="700" fill="#35c4d0">7</text>
  <line x1="1317.0" y1="618.0" x2="1752.0" y2="618.0"
        stroke="#2a3650" stroke-width="1.5"/>
  <text x="1317.0" y="705.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28.5"
        fill="#94a3b8">Schema differences</text>
  <text x="1752.0" y="705.0" text-anchor="end"
        font-family="Menlo, Consolas, monospace" font-size="60.0" font-weight="700" fill="#4ade80">0</text>
</svg>
